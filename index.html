<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Get a random piece of advice with a single click. A Frontend Mentor challenge solution powered by the Advice Slip API.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#202632">

  <title>Advice generator app | Frontend Mentor</title>

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&display=swap">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="./css/style.css">

  <script src="./js/app.js" defer></script>
</head>
<body class="d-flex flex-column">
  <main class="app flex-grow-1 d-flex align-items-center justify-content-center">
    <h1 class="visually-hidden">Advice generator</h1>

    <article class="card advice-card text-center" aria-labelledby="advice-heading">
      <div aria-live="polite" aria-atomic="true" data-advice-content>
        <h2 class="advice-card__heading text-uppercase" id="advice-heading">
          Advice <span aria-hidden="true">#</span><span class="visually-hidden">number </span><span data-advice-id>71</span>
        </h2>
        <blockquote class="advice-card__quote mb-0" cite="https://api.adviceslip.com/advice/71" data-advice-quote>
          <p class="mb-0" data-advice-text>It is easy to sit up and take notice, what's difficult is getting up and taking action.</p>
        </blockquote>
      </div>

      <p class="advice-card__error" role="alert" data-advice-error></p>
      <p class="visually-hidden" role="status" data-advice-status></p>

      <picture class="advice-card__divider">
        <source media="(min-width: 37.5em)" srcset="./images/pattern-divider-desktop.svg" width="444" height="16">
        <img src="./images/pattern-divider-mobile.svg" alt="" width="295" height="16">
      </picture>

      <button class="advice-card__button" type="button" data-advice-button>
        <svg class="advice-card__icon" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M20 0H4a4.005 4.005 0 0 0-4 4v16a4.005 4.005 0 0 0 4 4h16a4.005 4.005 0 0 0 4-4V4a4.005 4.005 0 0 0-4-4ZM7.5 18a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Zm0-9a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Zm4.5 4.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Zm4.5 4.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Zm0-9a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Z"/>
        </svg>
        <span class="visually-hidden">Generate new advice</span>
      </button>
    </article>
  </main>

  <footer class="attribution text-center">
    <p class="mb-0">
      <span class="d-inline-block">Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.</span>
      <span class="d-inline-block">Coded by <a href="https://github.com/KenzoSenna">Kenzo Senna</a>.</span>
    </p>
  </footer>
</body>
</html>
